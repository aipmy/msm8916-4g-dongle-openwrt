name: Build JZ0145 (netdev LED)

on:
  workflow_dispatch:
    inputs:
      openwrt_tag:
        description: 'OpenWrt tag (default: latest v25.12.x)'
        required: false
        default: ''
      upstream_commit:
        description: 'hkfuertes msm8916-openwrt commit (default: 99d0f10)'
        required: false
        default: '99d0f10671aa089139e104915608f73c190c4d6c'

env:
  TZ: Asia/Jakarta
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout (this repo)
      uses: actions/checkout@v4

    - name: Init environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Resolve OpenWrt version
      id: resolve
      run: |
        if [ -n "${{ inputs.openwrt_tag }}" ]; then
          echo "version=${{ inputs.openwrt_tag }}" >> $GITHUB_OUTPUT
        else
          VERSION=$(git ls-remote --tags https://git.openwrt.org/openwrt/openwrt.git 'v25.12.*' | grep -oP 'v25\.12\.\d+$' | sort -V | tail -1)
          [ -z "$VERSION" ] && echo "ERROR: cannot resolve OpenWrt tag" && exit 1
          echo "Resolved: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Clone OpenWrt
      run: |
        git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
        git -C openwrt checkout ${{ steps.resolve.outputs.version }}

    - name: Cache build toolchain and downloads
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
        key: openwrt-${{ steps.resolve.outputs.version }}-${{ hashFiles('openwrt-build/diffconfig_uz801') }}
        restore-keys: |
          openwrt-${{ steps.resolve.outputs.version }}-

    - name: Load msm89xx target (pinned upstream)
      run: |
        git clone https://github.com/hkfuertes/msm8916-openwrt.git upstream-msm
        git -C upstream-msm checkout ${{ inputs.upstream_commit }}
        chmod +x upstream-msm/apply_patches.sh
        ./upstream-msm/apply_patches.sh openwrt
        mv upstream-msm/msm89xx openwrt/target/linux/msm89xx
        mv upstream-msm/packages openwrt/package/msm8916
        mv upstream-msm/diffconfig_uz801 openwrt/.config.upstream

    - name: Apply aipmy fork overrides (LED netdev + JZ DTS)
      run: |
        # 1. Kernel config: enable LED triggers (was: # CONFIG_LEDS_TRIGGER_NETDEV is not set)
        CFG=openwrt/target/linux/msm89xx/config-6.12
        cp "$CFG" "$CFG.bak"
        python3 openwrt-build/scripts/apply_kernel_config.py "$CFG" openwrt-build/kernel-config/led-triggers.conf
        echo "--- diff config-6.12 ---"
        diff -u "$CFG.bak" "$CFG" || true
        # 2. DTS patch JZ0145 (LED R25/G6/B7 + SIM switch)
        # Salin langsung ke folder patches/ agar tidak memicu fallback PATCH_DIR
        # yang mengabaikan patch upstream (seperti 804 generic-uf02)
        cp openwrt-build/patches/dts-jz0145-leds-sim.patch openwrt/target/linux/msm89xx/patches/910-jz0145-leds-sim.patch
        # 3. Diffconfig final (upstream + kmod ledtrig + tools)
        cp openwrt-build/diffconfig_uz801 openwrt/.config
        echo "--- .config head ---"
        head -n 20 openwrt/.config

    - name: Feeds update/install
      run: |
        cd openwrt
        rm -rf tmp
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Defconfig + download
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Compile firmware
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt_jz0145_netdev_${{ steps.resolve.outputs.version }}_${{ env.FILE_DATE }}
        path: |
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-gpt_both0.bin
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-boot.img
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-system.img
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*.manifest
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-flash.sh
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-firmware.zip

    - name: Create Release
      if: env.UPLOAD_FIRMWARE == 'true' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-boot.img
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-system.img
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*-squashfs-gpt_both0.bin
          ${{ env.FIRMWARE }}/openwrt-msm89xx-*.manifest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
